<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="bannerTitle bannerDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif">
  <title id="bannerTitle">fml — Embodied AI · Robot Learning · VLA</title>
  <desc id="bannerDesc">GitHub profile banner</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060A14"/>
      <stop offset="0.55" stop-color="#0C1526"/>
      <stop offset="1" stop-color="#16224A"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#22D3EE" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#8B5CF6" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#94A3B8" opacity="0.13"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1280" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="300" rx="24" fill="url(#dots)"/>
  <ellipse cx="1120" cy="20" rx="360" ry="270" fill="url(#glowA)"/>
  <ellipse cx="120" cy="310" rx="380" ry="250" fill="url(#glowB)"/>

  <!-- orbit motif -->
  <g fill="none">
    <circle cx="1065" cy="150" r="138" stroke="#93C5FD" stroke-opacity="0.16"/>
    <circle cx="1065" cy="150" r="98" stroke="#93C5FD" stroke-opacity="0.26" stroke-dasharray="2 9" stroke-linecap="round"/>
    <circle cx="1065" cy="150" r="58" stroke="#A5B4FC" stroke-opacity="0.42"/>
    <path d="M1065 12 L952 229 L1178 229 Z" stroke="#A5B4FC" stroke-opacity="0.12"/>
  </g>
  <g fill="#67E8F9">
    <circle cx="1065" cy="12" r="4.5"/>
    <circle cx="952" cy="229" r="3.5" fill="#C4B5FD"/>
    <circle cx="1178" cy="229" r="3.5" fill="#C4B5FD"/>
  </g>
  <circle cx="1065" cy="150" r="26" fill="#0B1220" stroke="url(#accent)" stroke-width="2"/>
  <circle cx="1065" cy="150" r="6" fill="url(#accent)"/>

  <!-- copy -->
  <g>
    <text x="80" y="58" fill="#67E8F9" font-size="14.5" font-weight="600" letter-spacing="5">EMBODIED AI · ROBOT LEARNING · VLA</text>
    <rect x="80" y="72" width="86" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="78" y="164" fill="#F8FAFC" font-size="96" font-weight="700" letter-spacing="-2">fml</text>
    <text x="80" y="202" fill="#CBD5E1" font-size="20">SJTU · Electronic &amp; Computer Engineering · 具身智能与机器人操作</text>
  </g>

  <!-- chips -->
  <g font-size="13" font-weight="600">
    <rect x="80" y="224" width="104" height="30" rx="15" fill="#22D3EE" fill-opacity="0.08" stroke="#22D3EE" stroke-opacity="0.35"/>
    <text x="96" y="244" fill="#A5F3FC">Isaac Lab</text>

    <rect x="196" y="224" width="138" height="30" rx="15" fill="#818CF8" fill-opacity="0.08" stroke="#818CF8" stroke-opacity="0.35"/>
    <text x="212" y="244" fill="#C7D2FE">VLA Fine-tuning</text>

    <rect x="346" y="224" width="136" height="30" rx="15" fill="#C084FC" fill-opacity="0.08" stroke="#C084FC" stroke-opacity="0.35"/>
    <text x="362" y="244" fill="#E9D5FF">Shared Control</text>
  </g>

  <text x="1200" y="278" text-anchor="end" fill="#64748B" font-size="13" letter-spacing="1">@SBSJKM</text>
</svg>
